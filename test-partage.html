<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Parenthèse</title>
<style>
:root{
 color-scheme:light;
 font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 color:#20332d;background:#f5f5ef;
 --green:#225b48;--ink:#16382c;--line:#dce5db;--muted:#52645b;--surface:#fff;
 --serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
body{margin:0}
header{background:#153c30;color:#fff;min-height:70px;padding:12px max(20px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:11px;font-size:1rem;letter-spacing:.015em;white-space:nowrap}
.brand-icon{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:#d8e6ad;color:#1b4938;font-family:var(--serif);font-size:1.16rem;letter-spacing:-.09em}
#session{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:7px;font-size:.88rem}
header button{background:#214d3e;color:#fff;border-color:#577b6c;font-size:.83rem;min-height:36px}
main{max-width:1160px;margin:36px auto 60px;padding:0 20px}
h1{font-family:var(--serif);font-size:clamp(2rem,5vw,3.4rem);font-weight:400;letter-spacing:-.045em;line-height:1.05;margin:0 0 14px;color:var(--ink)}
h2{font-size:1.2rem;line-height:1.25;margin:0 0 12px;color:var(--ink)}
h3{line-height:1.35}
p,small{line-height:1.55}
small{display:block;color:var(--muted)}
button,input,textarea,select{font:inherit}
button,select,input,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 12px}
button{cursor:pointer;background:#fff;color:inherit;font-size:.94rem;font-weight:650;min-height:42px}
button.primary,button[aria-current=true]{background:var(--green);color:white;border-color:var(--green)}
:focus-visible{outline:3px solid #ae7933;outline-offset:3px}
label{display:block;margin:13px 0;font-weight:540}
input,textarea,select{display:block;width:100%;margin-top:6px;background:#fafbf8;color:inherit;font-weight:400;min-height:42px}
textarea{min-height:76px;resize:vertical}
nav,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
nav{padding:7px;background:#e8ede4;border:1px solid var(--line);border-radius:14px}
nav button:not([aria-current=true]){background:transparent;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px}
.card,details{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:13px}
.card{box-shadow:0 5px 16px #16382c08}
.card details{background:#f7f9f4}
.tag{display:inline-block;margin:0;padding:5px 10px;border-radius:20px;background:#e6eed2;color:#26472e;font-size:.8rem;font-weight:700}
.notice{background:#f9edce;color:#533f21;padding:12px 16px;border-radius:10px}
.muted{color:var(--muted)}
summary{cursor:pointer;font-weight:650}
.scale{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 15px}
.scale label{margin:0;cursor:pointer;border:1px solid #dce7d8;border-radius:9px;padding:8px;background:#edf3ea;font-size:.87rem}
.scale label:has(input:checked){background:var(--green);border-color:var(--green);color:white}
.scale input{display:inline;width:auto;min-height:0;margin:0 4px 0 0;accent-color:#36745d}
fieldset{border:0;padding:0;margin:14px 0;min-width:0}
legend{font-weight:650}
.scroll{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
td,th{padding:9px;text-align:left;border-bottom:1px solid var(--line)}
thead{background:#edf2e8}
.narrow{max-width:580px}
.split{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
progress{width:100%;accent-color:var(--green)}
.hero{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(220px,1fr);min-height:400px;background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden}
.hero-copy{padding:clamp(24px,5vw,60px);align-self:center}
.hero h1{font-size:clamp(2.75rem,7vw,5rem)}
.hero-copy>p{color:var(--muted);max-width:34rem;margin:0 0 20px}
.hero-copy .notice{max-width:35rem;font-size:.88rem;margin-top:22px}
.hero-art{display:grid;place-items:center;overflow:hidden;background:#1a4939;color:#dce7b4;font-family:var(--serif);font-size:clamp(130px,24vw,325px);line-height:1}
.hero-art span{display:block;border:1px solid #8eb49d;border-radius:50%;width:82%;aspect-ratio:1;text-align:center;line-height:.77;letter-spacing:-.08em}
.role-picker{margin-top:22px;max-width:700px}
.role-picker button{text-align:left;min-height:74px;padding:16px;font-size:1rem}
.profile{margin-top:15px;padding:22px;background:#e9efe1;border:1px solid var(--line);border-radius:17px}
.profile h1{margin:9px 0}
.profile p:last-child{margin-bottom:0}
.dossier-grid .card{border-top:3px solid #84a88b}
.dossier-grid .card:has(.tag-respiration){border-top-color:#c69b59}
.tag-respiration{background:#f3e6cf;color:#60451f}
.status{font-size:.88rem;font-weight:650;color:#365a47}
@media (hover:hover){
 button:hover{border-color:#6d9277}
 button.primary:hover{background:#194936}
 nav button:not([aria-current=true]):hover{background:#f6f8f2}
}
@media (max-width:650px){
 header{padding-inline:14px}
 main{margin-top:22px;padding-inline:14px}
 .hero{grid-template-columns:1fr;min-height:0}
 .hero-art{min-height:116px;font-size:124px}
 .hero-art span{width:140px;margin-block:-9px}
 .split .actions{margin:4px 0}
 nav{gap:4px}
 nav button{padding:7px;font-size:.83rem}
}
@media (max-width:390px){header{align-items:flex-start;flex-direction:column;gap:7px}#session{justify-content:flex-start}}
@media print{header,nav,button,.notice{display:none}main{margin:0}.card,details{break-inside:avoid}.card{box-shadow:none}}
#pdfReport{display:none}
@media print{
 @page{size:A4;margin:15mm}
 body.print-dossier{background:white;color:#182921;font-size:10pt}
 body.print-dossier #app{display:none}
 body.print-dossier #pdfReport{display:block;margin:0;padding:0;max-width:none}
 #pdfReport h2,#pdfReport h3,#pdfReport dt{break-after:avoid}
 #pdfReport h1{font-size:24pt}
 #pdfReport .card{break-inside:auto;padding:8px 12px}
 #pdfReport dd,#pdfReport p{white-space:pre-wrap;overflow-wrap:anywhere}
 #pdfReport dl{margin:8px 0}
 #pdfReport dd{margin:2px 0 8px 0}
}

.auteuil-card{display:inline-flex;align-items:center;gap:10px;margin-top:16px;padding:8px 12px 8px 8px;border:1px solid #e6d8dc;border-radius:12px;background:#fff;color:#453940;font-size:.82rem;font-weight:600}
.auteuil-card img{display:block;width:44px;height:44px;border-radius:4px}
.auteuil-footer{display:flex;justify-content:flex-end;align-items:center;gap:8px;width:min(100%,1180px);margin:0 auto;padding:0 24px 18px;color:#63575c;font-size:.76rem}
.auteuil-round{display:grid;place-items:center;width:40px;height:40px;border:1px solid #e6d8dc;border-radius:50%;background:#fff}
.auteuil-round img{width:25px;height:25px;border-radius:2px}
@media print{
 .auteuil-card{display:none}
 .auteuil-footer{position:fixed;right:0;bottom:-11mm;width:auto;margin:0;padding:0;font-size:8pt}
 .auteuil-round{width:9mm;height:9mm}
 .auteuil-round img{width:6mm;height:6mm}
}
</style>

  if(rows.length!==1){
   alert('Le dossier partagé a changé ou votre accès a expiré. Copiez votre saisie avant d’actualiser.');
   return false;
  }
  version=rows[0].version;
  savedMessage='Saisie enregistrée dans le dossier partagé.';
  return true;
 }catch(e){
  alert(e.message==='401'?'La connexion a expiré. Copiez votre saisie, puis reconnectez-vous.':'Enregistrement partagé impossible. Votre saisie est encore à l’écran.');
  return false;
 }finally{busy=false;app.inert=session.inert=false}
}
function reviewConflict(student,review){
 const entry=student.reviews.find(r=>r.kind==='Entrée');
 const exit=student.reviews.find(r=>r.kind==='Sortie');
 if(review.date<student.start||(review.kind!=='Entrée'&&entry&&review.date<entry.date))
  return 'La date du bilan doit être égale ou postérieure à la date d’entrée.';
 if(review.kind==='Entrée')
  return entry?'Un bilan d’entrée est déjà enregistré pour ce dossier.':'';
 if(!entry)return 'Le bilan d’entrée doit être enregistré en premier.';
 if(exit)return 'Un bilan de sortie est déjà enregistré pour ce dossier.';
 if(review.kind==='Intermédiaire'){
  const month=review.date.slice(0,7);
  if(student.group!=='Parcours')return 'Le bilan intermédiaire est réservé au groupe Parcours.';
  if(student.reviews.some(r=>r.date.slice(0,7)===month))
   return 'Un bilan d’entrée ou intermédiaire existe déjà pour ce mois.';
 }
 if(review.kind==='Sortie'&&student.reviews.some(r=>r.date>review.date))
  return 'La sortie doit suivre les bilans déjà enregistrés.';
 return '';
}
async function saveReview(original,review,status){
 const originalDraft=JSON.stringify(original.entryDraft);
 const sameReview=stored=>Object.keys(review).length===Object.keys(stored).length&&
  Object.entries(review).every(([key,value])=>stored[key]===value);
 const read=async()=>{
  const rows=await api(dossiersPath+'&select=version,payload',token);
  const row=rows[0];
  if(!row||!validBackup(row.payload))throw Error('Dossier partagé inaccessible.');
  return row;
 };
 busy=true;
 app.inert=session.inert=true;
 status.textContent='Enregistrement du bilan en cours…';
 try{
  let latest=await read();
  for(let attempt=0;attempt<2;attempt++){
   const student=latest.payload.students.find(s=>s.id===original.id);
   if(!student)throw Error('Ce dossier a été supprimé de l’espace partagé.');
   if(student.reviews.some(sameReview))break;
   const conflict=reviewConflict(student,review);
   if(conflict)throw Error(conflict);
   student.reviews.push(review);
   if(review.kind==='Entrée'&&JSON.stringify(student.entryDraft)===originalDraft)delete student.entryDraft;

   try{
    await api(dossiersPath+'&version=eq.'+latest.version+'&select=version',token,{
     method:'PATCH',headers:{Prefer:'return=representation'},
     body:JSON.stringify({version:latest.version+1,payload:latest.payload})
    });
   }catch(error){
    if(error.message==='401'||error.message==='403')throw error;
   }
   latest=await read();
  }
  const saved=latest.payload.students.find(s=>s.id===original.id);
  if(!saved?.reviews.some(sameReview))throw Error('La sauvegarde n’a pas pu être confirmée. Réessayez.');
  state=latest.payload;
  version=latest.version;
  clearReviewDraft(original,review.kind);
  savedReviewStudentId=original.id;
  savedMessage='Bilan enregistré dans le dossier partagé.';
  render();
 }catch(error){
  const detail=/^(401|403)$/.test(error.message)?'Reconnectez-vous dans cet onglet.':/^\d{3}$/.test(error.message)?'Le serveur n’a pas confirmé l’enregistrement. Réessayez.':error.message;
  status.textContent='Enregistrement non confirmé. '+detail+' Votre saisie reste affichée.';
  status.scrollIntoView({block:'nearest'});
 }finally{busy=false;app.inert=session.inert=false}
}

function validBackup(data){
 const record=x=>x&&typeof x==='object'&&!Array.isArray(x);
 const date=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&!Number.isNaN(Date.parse(x));
 const flat=x=>record(x)&&Object.values(x).every(v=>typeof v==='string');
 return record(data)&&Array.isArray(data.students)&&
 new Set(data.students.map(s=>s?.id)).size===data.students.length&&data.students.every(s=>
  record(s)&&typeof s.id==='string'&&/^[a-zA-Z0-9-]+$/.test(s.id)&&typeof s.name==='string'&&typeof s.classe==='string'&&
  ['Parcours','Respiration'].includes(s.group)&&date(s.start)&&(!s.end||date(s.end))&&
  Array.isArray(s.obs)&&s.obs.every(o=>flat(o)&&date(o.date))&&
  Array.isArray(s.reviews)&&s.reviews.every(r=>flat(r)&&date(r.date)&&['Entrée','Intermédiaire','Sortie'].includes(r.kind)&&
   Object.keys(r).every(k=>!/^([yp])\d+$/.test(k)||Number(k.slice(1))<(k[0]==='y'?young.length:pro.length)))&&
  (!s.history||(record(s.history)&&typeof s.history.notes==='string'&&(!s.history.date||date(s.history.date))&&
   Array.isArray(s.history.files)&&s.history.files.every(f=>record(f)&&typeof f.name==='string'&&typeof f.url==='string'&&archiveUrl.test(f.url))))&&
  record(s.weeks)&&Object.entries(s.weeks).every(([k,w])=>date(k)&&flat(w))&&
  (!s.entryDraft||(record(s.entryDraft)&&Object.entries(s.entryDraft).every(([k,v])=>k==='step'?Number.isInteger(v):typeof v==='string')))
 );
}
const archiveUrl=/^data:(?:application\/pdf|image\/(?:jpeg|png|webp));base64,[A-Za-z0-9+/]+={0,2}$/;
async function readArchiveFile(file){
 let source=file;
 if(/^image\/(jpeg|png|webp|heic|heif)$/.test(file.type)||/\.(jpe?g|png|webp|heic|heif)$/i.test(file.name)){
  const photo=await createImageBitmap(file);
  try{
   const scale=Math.min(1,1700/Math.max(photo.width,photo.height));
   const canvas=document.createElement('canvas');
   canvas.width=Math.max(1,Math.round(photo.width*scale));
   canvas.height=Math.max(1,Math.round(photo.height*scale));
   const context=canvas.getContext('2d');
   context.fillStyle='#fff';
   context.fillRect(0,0,canvas.width,canvas.height);
   context.drawImage(photo,0,0,canvas.width,canvas.height);
   source=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.82));
  }finally{photo.close()}
 }else{
  const header=await file.slice(0,5).text();
  if(header!=='%PDF-')throw Error('Format non pris en charge.');
  source=new Blob([file],{type:'application/pdf'});
 }
 if(!source||source.size>1500000)throw Error('Pièce trop volumineuse.');
 const url=await new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>resolve(reader.result);
  reader.onerror=()=>reject(reader.error);
  reader.readAsDataURL(source);
 });
 if(!archiveUrl.test(url))throw Error('Fichier non reconnu.');
 return {name:source.type==='image/jpeg'?file.name.replace(/\.[^.]+$/,'')+'.jpg':file.name,url};
}

function semaine(s,p){
const end=shift(period,6), list=s.obs.filter(o=>o.date>=period&&o.date<=end), summary=s.weeks[period]||{};
p.innerHTML='<section class="card"><div class="split"><h2>Du '+fmt(period)+' au '+fmt(end)+'</h2><div>'+button('←','prev')+' '+button('→','next')+'</div></div><div class="grid">'+weekly.map(w=>'<div><b>'+list.filter(o=>o.dynamic===w).length+'</b> · '+w+'</div>').join('')+'</div></section><form id="summary" class="card"><h2>Synthèse de l’équipe</h2>'+area('win','Réussite à valoriser',summary.win)+area('watch','Point d’attention',summary.watch)+area('next','Priorité commune pour la semaine suivante',summary.next)+(summary.adult?'<p>Dernière saisie · '+esc(summary.adult)+'</p>':'')+'<button class="primary">Enregistrer la synthèse</button></form><h2>Contributions de la semaine</h2>'+obsList(list);
form('summary',async v=>{if(!Object.values(v).some(x=>x.trim())){alert('Renseignez au moins un élément de synthèse.');return}const previous=s.weeks[period];s.weeks[period]={...v,adult};if(await save())render();else if(previous)s.weeks[period]=previous;else delete s.weeks[period]});
}
function reviewDraftKey(s,kind){
 return accountId?'parenthese:review:'+accountId+':'+s.id+':'+kind:null;
}
function readReviewDraft(s,kind){
 const key=reviewDraftKey(s,kind);
 if(!key)return null;
 try{return JSON.parse(sessionStorage.getItem(key)||'null')}catch{return null}
}
function clearReviewDraft(s,kind){
 const key=reviewDraftKey(s,kind);
 if(key){try{sessionStorage.removeItem(key)}catch{}}
}
function bindReviewDraft(form,s,kind,initial,getStep,status){
 const local=readReviewDraft(s,kind);
 const existing=local||initial;
 for(const field of form.elements){
  if(!field.name||!Object.hasOwn(existing,field.name))continue;
  if(field.type==='radio')field.checked=field.value===existing[field.name];
  else field.value=existing[field.name];
 }
 if(local)status.textContent='Saisie en cours récupérée dans cet onglet. Validez le bilan pour l’enregistrer dans le dossier partagé.';
 const remember=()=>{
  const key=reviewDraftKey(s,kind);
  if(!key)return;
  const values=Object.fromEntries(new FormData(form));
  if(getStep)values.step=getStep();
  try{sessionStorage.setItem(key,JSON.stringify(values))}
  catch{status.textContent='La copie de secours est indisponible. Gardez cet onglet ouvert et copiez votre saisie si nécessaire.'}
 };
 form.addEventListener('input',remember);
 form.addEventListener('change',remember);
 return remember;
}
function bilans(s,p){
const entry=s.reviews.find(r=>r.kind==='Entrée');
const closure=s.reviews.some(r=>r.kind==='Sortie');
const types=!entry?['Entrée']:closure?[]:s.group==='Parcours'?['Intermédiaire','Sortie']:['Sortie'];
const pending=s.group==='Parcours'&&entry&&!closure;
p.innerHTML='<div class="actions">'+types.map(k=>button({'Entrée':s.entryDraft||readReviewDraft(s,k)?'Reprendre le brouillon':'Commencer le bilan d’entrée','Intermédiaire':readReviewDraft(s,k)?'Reprendre le bilan intermédiaire':'Bilan intermédiaire','Sortie':readReviewDraft(s,k)?'Reprendre le bilan de sortie':'Bilan de sortie'}[k],'review'+k,true)).join('')+'</div>'+(pending?'<p class="muted">Un bilan intermédiaire par mois pendant le parcours.</p>':'')+'<div id="review"></div><h2>Bilans enregistrés</h2>'+([...s.reviews].reverse().map(r=>'<details><summary>'+esc(r.kind)+' · '+fmt(r.date)+' · '+esc(r.adult)+'</summary>'+reviewRead(r)+'</details>').join('')||'<p class="muted">Aucun bilan enregistré.</p>');
}
function reviewRead(r){
const content=Object.entries(r).filter(([k,v])=>v&&!['kind','date','adult'].includes(k));
return '<dl>'+content.map(([k,v])=>{const m=k.match(/^([yp])([0-9]+)$/);const label=m?(m[1]==='y'?young[+m[2]]:pro[+m[2]][0]):reviewLabels[k]||k;return '<dt><b>'+esc(label)+'</b></dt><dd>'+esc(v)+'</dd>'}).join('')+'</dl>';
}
const reviewLabels={mood:'Ressenti',energy:'Énergie',expect:'Attentes du jeune',gain:'Ce que le jeune retient',origin:'Origine de la demande',reason:'Motifs et contexte de l’accueil',initial:'Freins et points d’appui',commit:'Engagements et aménagements',action:'Préconisation de sortie',meeting:'Date de réunion avec l’établissement et la famille',support:'Points de vigilance et aménagements à maintenir'};
openYoung.forEach((l,i)=>reviewLabels['text'+i]=l);
domains.forEach((l,i)=>{reviewLabels['goal'+i]='Objectif · '+l;reviewLabels['means'+i]='Moyens · '+l;reviewLabels['status'+i]='État de l’objectif · '+l;reviewLabels['team'+i]='Constat de l’équipe · '+l;reviewLabels['voice'+i]='Regard du jeune · '+l});
Object.assign(reviewLabels,{
 present:'Personnes présentes', family:'Responsables légaux informés', adhesion:'Adhésion du jeune',
 rhythm:'Rythme d’accueil et aménagement du temps scolaire', logistics:'Matériel, transport et restauration',
 interests:'Ce que le jeune aime faire ou aimerait essayer', obstacle:'Ce qui rend le collège difficile en ce moment',
 resource:'Ce qui aide le jeune et les personnes ressources', checkpoint:'Date du prochain point',
 contact:'Qui fait le point avec le jeune ?', firstAction:'Première action convenue'
});
domains.forEach((l,i)=>reviewLabels['evidence'+i]='Signe de réussite · '+l);
const firstActionExamples=[
 'Choisir une première activité à essayer avec le référent',
 'Faire un point de cinq minutes avec le référent après la première séance',
 'Repérer un adulte à solliciter si une difficulté se présente',
 'Essayer la carte pause pendant un atelier',
 'Choisir une tâche courte à terminer pendant la prochaine séance',
 'Préparer une question à poser lors de l’atelier orientation',
 'Choisir un rôle dans le prochain travail de groupe',
 'Préparer ensemble le matériel pour la prochaine séance'
];
function entryForm(s,target){
const existing=s.entryDraft||{};
const objectiveExamples=['Demander une pause avant de quitter l’activité','Tenir un rôle pendant un atelier collectif','Commencer une tâche avec une consigne écrite','Poser une question sur un métier pendant une visite'];
const stages=[
 ['Cadre de l’accueil',input('date','Date de l’entretien','date',today(),true)+input('present',reviewLabels.present)+select('family',reviewLabels.family,['Oui','Non','À vérifier'])+select('origin',reviewLabels.origin,['Équipe éducative collège','Vie scolaire / CPE','Famille / Jeune','Commission / Partenaire'])+area('reason',reviewLabels.reason)+select('adhesion',reviewLabels.adhesion,['Favorable','À accompagner','Réticente'])+area('rhythm',reviewLabels.rhythm,s.schedule||'')+area('logistics',reviewLabels.logistics)],
 ['La parole du jeune','<p>Tu peux répondre à ton rythme. C’est ton ressenti.</p>'+area('expect','Qu’est-ce que tu aimerais que La Parenthèse t’apporte ?')+area('interests','Qu’est-ce que tu aimes faire ou aimerais essayer ici ?')+area('obstacle','Qu’est-ce qui est difficile pour toi au collège en ce moment ?')+area('resource','Qu’est-ce qui t’aide quand c’est difficile ? À qui peux-tu parler ?')+scale('mood','Je me sens',['Bien','Moyen','Pas très bien'])+scale('energy','Mon énergie',['Haute','Moyenne','Basse'])+groups(young,'y',youthDomains,3,ys)+openYoung.map((l,i)=>area('text'+i,l)).join('')],
 ['Le regard de l’équipe','<p>Notez les faits et les aides déjà utiles. Pour un indicateur que vous n’avez pas encore pu apprécier, choisissez « Non observé ».</p>'+area('initial',reviewLabels.initial)+area('commit',reviewLabels.commit)+groups(pro,'p',domains,7,ps)],
 ['Les objectifs et la suite','<p>Choisissez avec le jeune les priorités du moment. Pour chaque objectif retenu, précisez l’aide prévue et un signe observable de réussite.</p>'+domains.map((d,i)=>'<details><summary>'+d+'</summary><p class="muted">Par exemple, '+objectiveExamples[i].toLowerCase()+'.</p>'+area('goal'+i,'Objectif choisi avec le jeune')+area('means'+i,'Aide prévue et adulte qui l’apporte')+area('evidence'+i,'À quoi verra-t-on que l’objectif est atteint ?')+'</details>').join('')+'<p>La première action convenue, c’est le petit pas que le jeune et l’adulte décident de faire juste après l’entretien. Indiquez si possible qui fait quoi et quand.</p>'+select('actionExample','Choisir un exemple',firstActionExamples).replace('name="actionExample"','id="actionExample"')+area('firstAction',reviewLabels.firstAction)+input('contact',reviewLabels.contact,'text',s.ref||'')+input('checkpoint',reviewLabels.checkpoint,'date')]
];
target.innerHTML='<form id="entryForm" class="card"><h2>Entretien d’entrée</h2><p id="entryProgress" role="status"></p><progress max="4" value="1" aria-label="Avancement de l’entretien"></progress>'+stages.map(([title,body],i)=>'<section data-entry-step="'+i+'"><h3>'+title+'</h3>'+body+'</section>').join('')+'<div class="actions" id="entryActions"></div><p id="entryMessage" role="status"></p></form>';
const f=document.getElementById('entryForm'), actions=f.querySelector('#entryActions'), message=f.querySelector('#entryMessage');
const resume=readReviewDraft(s,'Entrée')||existing;
let step=Number.isInteger(resume.step)?Math.min(3,Math.max(0,resume.step)):0;
const remember=bindReviewDraft(f,s,'Entrée',existing,()=>step,message);
const actionExample=f.querySelector('#actionExample');
actionExample.onchange=()=>{
 const action=f.elements.firstAction;
 if(actionExample.value){
  action.value=action.value.trim()?action.value.trimEnd()+'\n'+actionExample.value:actionExample.value;
  actionExample.value='';
  remember();
  action.focus();
 }
};
function draw(){
 f.querySelectorAll('[data-entry-step]').forEach((section,i)=>section.hidden=i!==step);
 f.querySelector('#entryProgress').textContent='Étape '+(step+1)+' sur '+stages.length;
 f.querySelector('progress').value=step+1;
 actions.innerHTML=(step>0?'<button type="button" data-step="-1">Précédent</button>':'')+'<button type="button" data-draft>Enregistrer le brouillon</button>'+(step<3?'<button type="button" class="primary" data-step="1">Continuer</button>':'<button class="primary">Valider le bilan d’entrée</button>');
}
function values(){return Object.fromEntries(new FormData(f))}
actions.onclick=async e=>{
 const b=e.target.closest('button');
 if(!b)return;
 if(b.hasAttribute('data-draft')){
  remember();
  const previous=s.entryDraft;
  s.entryDraft={...values(),step};
  if(await save()){message.textContent='Brouillon enregistré dans le dossier partagé.';savedMessage='';}
  else s.entryDraft=previous;
 }
 if(b.dataset.step){
  step+=Number(b.dataset.step);
  message.textContent='';
  draw();
  remember();
  target.scrollIntoView();
 }
};
f.noValidate=true;
form('entryForm',async v=>{
 if(step!==3||busy)return;
 remember();
 if(!v.date||v.date<s.start){
  step=0;
  draw();
  message.textContent='Indiquez une date d’entretien égale ou postérieure à la date d’entrée du dossier.';
  return;
 }
 const prefilled={rhythm:s.schedule||'',contact:s.ref||''};
 const hasContent=Object.entries(v).some(([field,value])=>{
  const answer=value.trim();
  return field!=='date'&&answer!==''&&answer!==(prefilled[field]||'').trim();
 });
 if(!hasContent){
  message.textContent='Renseignez au moins un élément du bilan avant de valider.';
  return;
 }
 await saveReview(s,{...v,kind:'Entrée',adult},message);
});
draw();
target.scrollIntoView();
}
function showReview(s,kind){
const entry=s.reviews.find(r=>r.kind==='Entrée');
if(kind==='Entrée'){if(!entry)entryForm(s,document.querySelector('#review'));return}
const closingNow=kind==='Sortie';
const objectives=domains.map((d,i)=>'<div class="card"><b>'+d+'</b>'+(entry?.['goal'+i]?'<p>'+esc(entry['goal'+i])+'</p>'+(entry['means'+i]?'<small>Aide prévue · '+esc(entry['means'+i])+'</small>':'')+(entry['evidence'+i]?'<small>Signe de réussite prévu · '+esc(entry['evidence'+i])+'</small>':'')+select('status'+i,'État de l’objectif',['Atteint','Partiellement atteint','À poursuivre','Non évalué']):'<p class="muted">Aucun objectif fixé à l’entrée dans ce domaine.</p>')+area('team'+i,reviewLabels['team'+i])+(closingNow?area('voice'+i,reviewLabels['voice'+i]):'')+'</div>').join('');
const target=document.querySelector('#review');
target.innerHTML='<form class="card" id="reviewForm"><h2>Bilan · '+esc(kind)+'</h2>'+input('date','Date','date',today(),true)+'<h2>Auto-évaluation du jeune</h2><p>C’est ton ressenti. Il n’y a pas de bonne ou de mauvaise réponse.</p>'+groups(young,'y',youthDomains,3,ys)+scale('mood','Je me sens',['Bien','Moyen','Pas très bien'])+scale('energy','Mon énergie',['Haute','Moyenne','Basse'])+openYoung.map((l,i)=>area('text'+i,l)).join('')+(closingNow?area('gain',reviewLabels.gain):'')+'<h2>Évaluation de l’équipe</h2>'+groups(pro,'p',domains,7,ps)+'<h2>Objectifs et accompagnement</h2>'+objectives+(closingNow?select('action',reviewLabels.action,closing)+input('meeting',reviewLabels.meeting,'date')+area('support',reviewLabels.support):'')+'<p id="reviewMessage" role="status"></p><button class="primary">Enregistrer le bilan</button></form>';
target.scrollIntoView();
const reviewMessage=document.querySelector('#reviewMessage');
const rememberReview=bindReviewDraft(document.getElementById('reviewForm'),s,kind,{},null,reviewMessage);
form('reviewForm',async v=>{
 if(busy)return;
 rememberReview();
 if(!Object.entries(v).some(([field,value])=>field!=='date'&&value.trim())){
  reviewMessage.textContent='Renseignez au moins une réponse ou un objectif.';
  return;
 }
 await saveReview(s,{...v,kind,adult},reviewMessage);
});
}
const exportSections={bilans:'Bilans enregistrés',observations:'Observations enregistrées',semaines:'Synthèses hebdomadaires'};
function pdfExports(s,p){
 const counts={bilans:s.reviews.length,observations:s.obs.length,semaines:Object.keys(s.weeks).length};
 p.innerHTML='<section class="card"><h2>Documents PDF</h2><p>Choisissez le dossier complet ou une rubrique. Dans la fenêtre d’impression, choisissez « Enregistrer au format PDF » ou « PDF → Enregistrer au format PDF ».</p>'+button('Dossier complet en PDF','pdf:all',true)+'</section><div class="grid">'+Object.entries(exportSections).map(([k,label])=>'<section class="card"><h2>'+label+'</h2><p>'+counts[k]+' enregistré(s)</p>'+button('PDF · '+label,'pdf:'+k)+'</section>').join('')+'</div>';
}
function printDossier(s,section){
 const reviews=[...s.reviews].sort((a,b)=>a.date.localeCompare(b.date));
 const weeks=Object.entries(s.weeks).sort(([a],[b])=>a.localeCompare(b));
 const parts={
  bilans:()=>reviews.map(r=>'<article class="card"><h3>'+esc(r.kind)+' · '+fmt(r.date)+' · '+esc(r.adult)+'</h3>'+reviewRead(r)+'</article>').join(''),
  observations:()=>obsList(s.obs),
  semaines:()=>weeks.map(([date,w])=>'<article class="card"><h3>Du '+fmt(date)+' au '+fmt(shift(date,6))+'</h3><p>'+esc(w.adult)+'</p><dl>'+[['win','Réussite à valoriser'],['watch','Point d’attention'],['next','Priorité commune pour la semaine suivante']].filter(([k])=>w[k]).map(([k,label])=>'<dt><b>'+label+'</b></dt><dd>'+esc(w[k])+'</dd>').join('')+'</dl></article>').join('')
 };
 const sections=section==='all'?Object.keys(exportSections):[section];
 const report=document.querySelector('#pdfReport');
 report.innerHTML='<h1>La Parenthèse</h1><h2>'+esc(s.name)+'</h2><p>'+esc(s.classe)+' · '+esc(s.group)+(s.module?' · Module '+esc(s.module):'')+'</p><p>Entrée le '+fmt(s.start)+(s.end?' · Fin prévue le '+fmt(s.end):'')+(s.ref?' · Référent : '+esc(s.ref):'')+'</p>'+(s.schedule?'<p>Rythme d’accueil : '+esc(s.schedule)+'</p>':'')+(section==='all'?historySection(s,true):'')+sections.map(k=>'<section><h2>'+exportSections[k]+'</h2>'+(parts[k]()||'<p>Aucune saisie enregistrée.</p>')+'</section>').join('');
 const previousTitle=document.title;
 document.title='La Parenthèse - '+s.name+' - '+(exportSections[section]||'Dossier complet');
 report.removeAttribute('aria-hidden');
 document.body.classList.add('print-dossier');
 window.addEventListener('afterprint',()=>{
  document.body.classList.remove('print-dossier');
  report.setAttribute('aria-hidden','true');
  report.innerHTML='';
  document.title=previousTitle;
 },{once:true});
 window.print();
}
function evolution(s,p){
const history=historySection(s);
if(!s.reviews.length){p.innerHTML=history+'<p>Enregistrez un bilan pour afficher la comparaison.</p>';return}
const reviews=[...s.reviews].sort((a,b)=>a.date.localeCompare(b.date));
function table(title,items,prefix){return '<section class="card scroll"><h2>'+title+'</h2><table><thead><tr><th>Indicateur</th>'+reviews.map(r=>'<th>'+esc(r.kind)+'<br>'+fmt(r.date)+'</th>').join('')+'</tr></thead><tbody>'+items.map((l,i)=>'<tr><th scope="row">'+esc(l)+'</th>'+reviews.map(r=>'<td>'+esc(r[prefix+i]||'—')+'</td>').join('')+'</tr>').join('')+'</tbody></table></section>'}
p.innerHTML=button('Imprimer / PDF','print')+history+table('Regard du jeune',young,'y')+table('Regard professionnel',pro.map(a=>a[0]),'p');
}
app.onclick=handle;session.onclick=handle;
async function handle(e){
if(busy)return;
const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;
if(action==='switch'){observationEdit=null;adult='';token='';accountId='';version=null;state={students:[]};selected='';render();return}
if(!adult)return;
if(action==='deleteStudent'){
 const index=state.students.findIndex(s=>s.id===selected);
 if(index<0)return;
 const student=state.students[index];
 if(!confirm('Supprimer définitivement le dossier de '+student.name+' ? Les observations, synthèses, bilans et pièces jointes de cet élève seront aussi supprimés.'))return;
 state.students.splice(index,1);
 if(!await save()){state.students.splice(index,0,student);return}
 selected='';
 observationEdit=null;
 savedMessage='Dossier supprimé.';
 render();
 return;
}
if(action==='refreshShared'){
 if(!confirm('Actualiser les dossiers partagés ? Vérifiez que toute autre saisie est enregistrée.'))return;
 busy=true;
 app.inert=session.inert=true;
 try{
  if(!await loadShared(token)){alert('Ce compte ne peut plus accéder à l’espace partagé.');return}
  observationEdit=null;
  render();
 }catch{alert('Actualisation impossible. Vérifiez la connexion ou reconnectez-vous.')}
 finally{busy=false;app.inert=session.inert=false}
 return;
}
if(action.startsWith('editObs')){
 observationEdit=Number(action.slice(7));
 render();
 document.querySelector('#obs').scrollIntoView();
 return;
}
if(action==='cancelObs'){observationEdit=null;render();return}
observationEdit=null;
if(action.startsWith('pdf:')){
 const student=state.students.find(s=>s.id===selected);
 if(student)printDossier(student,action.slice(4));
 return;
}
if(action==='print'){window.print();return}
if(action==='home')selected='';
else if(action.startsWith('student')){selected=action.slice(7);tab=state.students.find(s=>s.id===selected).reviews.length?'observations':'bilans';period=monday(today())}
else if(action.startsWith('filter'))filter=['Tous','Parcours','Respiration'][+action.slice(6)];
else if(action.startsWith('review')){showReview(state.students.find(s=>s.id===selected),action.slice(6));return}
else if(action==='prev'||action==='next')period=shift(period,action==='prev'?-7:7);
else tab=action;
render();
}
initialScreen();
</script></html>
